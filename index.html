<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Game - Coördinaten Systeem</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .draggable-panel {
            position: absolute;
            background: #2b2b2b;
            border: 2px solid #555;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: default;
            user-select: none;
        }

        .panel-header {
            height: 30px;
            background: #444;
            color: #ffd700;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            cursor: grab;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }

        .panel-header:active {
            cursor: grabbing;
        }

        .panel-content {
            padding: 0;
        }

        #game-container { top: 50px; left: 50px; }

        /* Kamer afmetingen (300x200) */
        #room {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #333;
            background-image: url('Empty_Room.png');
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        #room-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }

        #room-content.fade-out { opacity: 0; }

        #hero {
            position: absolute;
            width: 32px;
            height: 32px;
            background-image: url('Hero.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            transition: left 0.1s, top 0.1s;
            z-index: 10;
        }

        .ui-panel { width: 300px; min-height: 150px; }
        #inventory-panel { top: 50px; left: 380px; }
        #quest-panel { top: 250px; left: 380px; }
        
        .door-asset { 
            cursor: pointer; 
            position: absolute; 
            width: 40px; 
            height: 40px; 
            z-index: 5; 
        }

        .reset-btn {
            background: #c0392b;
            color: white;
            border: none;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .reset-btn:hover { background: #e74c3c; }
    </style>
</head>
<body>

    <div id="game-container" class="draggable-panel ui-panel" data-id="game-container">
        <div class="panel-header">
            <span>Speelveld</span>
            <button class="reset-btn" onclick="resetGameCache()" title="Wis lokale cache en herlaad">Reset Cache</button>
        </div>
        <div class="panel-content">
            <div id="room">
                <div id="room-content">
                    <div id="hero"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="inventory-panel" class="draggable-panel ui-panel" data-id="inventory-panel">
        <div class="panel-header"><span>Inventory</span></div>
        <div class="panel-content" style="padding: 10px; font-size: 14px; color: #ccc;">Leeg</div>
    </div>

    <div id="quest-panel" class="draggable-panel ui-panel" data-id="quest-panel">
        <div class="panel-header"><span>Communicatie & Opdrachten</span></div>
        <div id="quest-content" class="panel-content" style="padding: 10px; font-size: 14px; color: #ccc;">Klik op een deur om de puzzel te starten.</div>
    </div>
	
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- Draggable Logic ---
        const panels = document.querySelectorAll('.draggable-panel');
        panels.forEach(panel => {
            const panelId = panel.getAttribute('data-id');
            const savedPos = localStorage.getItem(`panel_pos_${panelId}`);
            if (savedPos) {
                const pos = JSON.parse(savedPos);
                panel.style.left = pos.left + 'px';
                panel.style.top = pos.top + 'px';
            }

            const handle = panel.querySelector('.panel-header');
            let isDragging = false, startX, startY;

            handle.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                isDragging = true;
                startX = e.clientX - panel.offsetLeft;
                startY = e.clientY - panel.offsetTop;
                panel.style.zIndex = 1000;
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panel.style.left = (e.clientX - startX) + 'px';
                panel.style.top = (e.clientY - startY) + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    localStorage.setItem(`panel_pos_${panelId}`, JSON.stringify({left: panel.offsetLeft, top: panel.offsetTop}));
                }
            });
        });

        // --- Cache Reset Functie ---
        function resetGameCache() {
            if(confirm('Weet je zeker dat je alle lokale deurstatussen wilt wissen?')) {
                localStorage.removeItem('dungeon_unlocked_doors');
                location.reload();
            }
        }

        // --- Supabase Koppeling ---
        const supabaseUrl = 'https://mgqoxmnryqekrpjglffb.supabase.co/';
        const supabaseKey = 'sb_publishable_btgAerx5A8O7urSEflRDAg_8NSdtoOu';
        const dbClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const oppositeSideMap = { 'north': 'south', 'east': 'west', 'south': 'north', 'west': 'east' };

        function getLocalDoorStatus(x, y, wallSide) {
            const savedState = localStorage.getItem(`dungeon_unlocked_doors`);
            const stateMap = savedState ? JSON.parse(savedState) : {};
            return !!stateMap[`${x}_${y}_${wallSide}`];
        }

        // Slaat de deur open op HUIDIGE coördinaat ÉN direct aan de andere kant bij de buurman!
        function setLocalDoorStatus(posX, posY, wallSide) {
            const savedState = localStorage.getItem(`dungeon_unlocked_doors`);
            const stateMap = savedState ? JSON.parse(savedState) : {};
            
            // 1. Markeer open op huidige kamer
            stateMap[`${posX}_${posY}_${wallSide}`] = true;

            // 2. Bepaal doelcoördinaat en tegenspeler-muur om ook die kant direct te openen
            let targetX = posX;
            let targetY = posY;
            if (wallSide === 'north') targetY += 1;
            if (wallSide === 'south') targetY -= 1;
            if (wallSide === 'east') targetX += 1;
            if (wallSide === 'west') targetX -= 1;

            const oppSide = oppositeSideMap[wallSide];
            stateMap[`${targetX}_${targetY}_${oppSide}`] = true;

            localStorage.setItem(`dungeon_unlocked_doors`, JSON.stringify(stateMap));
        }

        async function loadRoomByCoords(posX, posY, entrySide = 'south') {
            const roomContent = document.getElementById('room-content');
            
            const updateRoomContent = async () => {
                try {
                    const { data: puzzles, error: puzzleError } = await dbClient
                        .from('Puzzle_Labyrinth')
                        .select('*')
                        .eq('pos_x', posX)
                        .eq('pos_y', posY);

                    if (puzzleError) throw puzzleError;

                    const headerSpan = document.querySelector('#game-container .panel-header span');
                    if(headerSpan) headerSpan.textContent = `(${posX}, ${posY}) Kamer ${puzzles?.[0]?.room_id || '?'}`;
                    
                    const hero = document.getElementById('hero');
                    roomContent.innerHTML = ''; 
                    roomContent.appendChild(hero);

                    setHeroPosition(hero, entrySide);

                    if (puzzles && puzzles.length > 0) {
                        puzzles.forEach(puzzle => {
                            const img = document.createElement('img');
                            const wallSide = puzzle.wall_side;

                            let targetX = posX;
                            let targetY = posY;
                            if (wallSide === 'north') targetY += 1;
                            if (wallSide === 'south') targetY -= 1;
                            if (wallSide === 'east') targetX += 1;
                            if (wallSide === 'west') targetX -= 1;

                            const hasActivePuzzle = puzzle.question && puzzle.question.trim() !== "";
                            let isSolved = !hasActivePuzzle || getLocalDoorStatus(posX, posY, wallSide);

                            img.src = isSolved ? 'DoorWay.png' : 'Door.png';
                            img.className = 'door-asset';
                            
                            setDoorPositionAndStyle(img, wallSide);

                            img.addEventListener('click', async () => {
                                const { data: freshData } = await dbClient
                                    .from('Puzzle_Labyrinth')
                                    .select('question')
                                    .eq('pos_x', posX)
                                    .eq('pos_y', posY)
                                    .eq('wall_side', wallSide)
                                    .single();

                                const liveHasPuzzle = freshData && freshData.question && freshData.question.trim() !== "";
                                const liveSolved = !liveHasPuzzle || getLocalDoorStatus(posX, posY, wallSide);

                                if (!liveSolved) {
                                    triggerDoorPuzzle(puzzle, (success) => {
                                        if (success) {
                                            setLocalDoorStatus(posX, posY, wallSide);
                                            img.src = 'DoorWay.png';
                                        }
                                    });
                                } else {
                                    loadRoomByCoords(targetX, targetY, oppositeSideMap[wallSide]);
                                }
                            });

                            roomContent.appendChild(img);
                        });
                    } else {
                        console.log(`Geen muren/puzzels gevonden voor coördinaat (${posX}, ${posY})`);
                    }

                } catch (err) { 
                    console.error("Fout bij laden kamer op coördinaten:", err); 
                }
            };

            if (entrySide === null) {
                await updateRoomContent();
            } else {
                roomContent.classList.add('fade-out');
                setTimeout(async () => { 
                    await updateRoomContent(); 
                    roomContent.classList.remove('fade-out'); 
                }, 300);
            }
        }

        function setHeroPosition(hero, side) {
            const rotations = { 'north': '180deg', 'east': '-90deg', 'south': '0deg', 'west': '90deg' };
            switch(side) {
                case 'north': 
                    hero.style.left = '134px'; hero.style.top = '25px'; break;
                case 'east': 
                    hero.style.left = '235px'; hero.style.top = '84px'; break;
                case 'south': 
                    hero.style.left = '134px'; hero.style.top = '140px'; break;
                case 'west': 
                    hero.style.left = '30px'; hero.style.top = '84px'; break;
            }
            hero.style.transform = `rotate(${rotations[side] || '0deg'})`;
        }

        function setDoorPositionAndStyle(img, wallSide) {
            switch(wallSide) {
                case 'north':
                    img.style.top = '-5px';
                    img.style.left = '130px';
                    img.style.transform = 'rotate(0deg)';
                    break;
                case 'east':
                    img.style.top = '80px';
                    img.style.left = '265px';
                    img.style.transform = 'rotate(90deg)';
                    break;
                case 'south':
                    img.style.top = '165px';
                    img.style.left = '130px';
                    img.style.transform = 'rotate(180deg)';
                    break;
                case 'west':
                    img.style.top = '80px';
                    img.style.left = '-5px';
                    img.style.transform = 'rotate(-90deg)';
                    break;
            }
        }

        function triggerDoorPuzzle(puzzle, callback) {
            const questContent = document.getElementById('quest-content');
            const q = puzzle.question || "Los de puzzel op:";
            const a = puzzle.solution || "open";

            questContent.innerHTML = `
                <p><strong>Vraag:</strong> ${q}</p>
                <input type="text" id="p-ans" placeholder="Jouw antwoord..." style="width: 80%; padding: 5px; margin-bottom: 5px;"><br>
                <button id="btn-ans" style="padding: 5px 10px; cursor: pointer;">Beantwoord</button>
            `;

            document.getElementById('btn-ans').onclick = () => {
                const userAnswer = document.getElementById('p-ans').value.trim();
                if(userAnswer.toLowerCase() === a.toLowerCase()) {
                    questContent.innerHTML = "<span style='color: #4cd137;'>Juist! De deur is nu een open doorgang. Klik nogmaals om door te lopen.</span>";
                    callback(true);
                } else {
                    questContent.innerHTML += "<br><span style='color: #ff6b6b;'>Fout antwoord! Probeer opnieuw.</span>";
                    callback(false);
                }
            };
        }

        // Start het spel op coördinaat (0, 0)
        loadRoomByCoords(0, 0, 'south');
    </script>
</body>
</html>
