<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Editor - Vaste Kamer & Draaiende Speler</title>
    <style>
        body {
            background-color: #8B0000;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #game-container {
            position: relative;
            width: 600px;
            height: 600px;
            border: 4px solid #333;
            background-color: #5B5B00;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            opacity: 1;
            transition: opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="550"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 1. AFBEELDINGEN LADEN
        const assets = {
            room: new Image(),
            door: new Image(),
            doorway: new Image(),
            hero: new Image(),
            kompass: new Image(),
            thumbsUp: new Image(),
            thumbsDown: new Image()
        };

        assets.room.src = "EmptyRoom.png";
        assets.door.src = "Door.png";
        assets.doorway.src = "DoorWay.png";
        assets.hero.src = "Hero.png";
        assets.kompass.src = "Kompass.png";
        assets.thumbsUp.src = "ThumbsUp.png";
        assets.thumbsDown.src = "ThumbsDown.png";

        // 2. STANDAARD KAMERS
        const defaultDungeon = {
            0: {
                roomNo: 0, totRooms: 4,
                doorWayStat: [2, 2, 0, 2], // Top, Right, Left open
                likes: [0, 0, 0, 0], puzzleSolved: [true, true, false, true],
                targetRooms: { top: 1, right: 2, bottom: null, left: 3 }
            },
            1: {
                roomNo: 1, totRooms: 4,
                doorWayStat: [1, 0, 2, 0], // Top open, Bottom open (terug naar 0)
                likes: [0, 0, 0, 0], puzzleSolved: [false, false, true, false],
                targetRooms: { top: null, right: null, bottom: 0, left: null }
            },
            2: {
                roomNo: 2, totRooms: 4,
                doorWayStat: [1, 0, 0, 2], // Top open, Left open (terug naar 0)
                likes: [0, 0, 0, 0], puzzleSolved: [false, false, false, true],
                targetRooms: { top: null, right: null, bottom: null, left: 0 }
            },
            3: {
                roomNo: 3, totRooms: 4,
                doorWayStat: [1, 2, 0, 0], // Top open, Right open (terug naar 0)
                likes: [0, 0, 0, 0], puzzleSolved: [false, true, false, false],
                targetRooms: { top: null, right: 0, bottom: null, left: null }
            }
        };

        let rooms = JSON.parse(localStorage.getItem("dungeon_rooms")) || defaultDungeon;
        let currentRoomId = 0;
        let entrySide = 2; // Standaard onderaan binnenkomen

        function saveDungeonData() {
            localStorage.setItem("dungeon_rooms", JSON.stringify(rooms));
        }

        let loadedImages = 0;
        const totalImages = Object.keys(assets).length;

        for (let key in assets) {
            assets[key].onload = () => {
                loadedImages++;
                if (loadedImages === totalImages) {
                    drawRoom(currentRoomId, entrySide);
                }
            };
        }

        // 3. GENERIEKE TEKEN-FUNCTIE
        function drawRoom(roomId, entry) {
            const room = rooms[roomId];
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // A. Achtergrond kamer
            ctx.drawImage(assets.room, 150, 200, 300, 300);

            // B. Muren tekenen
            for (let side = 0; side < 4; side++) {
                drawWall(side, room.doorWayStat[side], room.likes[side]);
            }

            // C. Held plaatsen en laten meedraaien op basis van de ingang
            let heroX = 277, heroY = 430;
            let heroAngle = 0; // Standaard omhoog (North)

            if (entry === 0) { // Binnengekomen via bovenste deur -> staat boven, kijkt omlaag (South)
                heroX = 267; heroY = 225; heroAngle = Math.PI;
            } else if (entry === 1) { // Binnengekomen via rechter deur -> staat rechts, kijkt naar links (West)
                heroX = 380; heroY = 320; heroAngle = -Math.PI / 2;
            } else if (entry === 2) { // Binnengekomen via onderste deur -> staat onder, kijkt omhoog (North)
                heroX = 282; heroY = 430; heroAngle = 0;
            } else if (entry === 3) { // Binnengekomen via linker deur -> staat links, kijkt naar rechts (East)
                heroX = 170; heroY = 330; heroAngle = Math.PI / 2;
            }

            ctx.save();
            ctx.translate(heroX + 26, heroY + 25); // Verplaats naar het midden van de held
            ctx.rotate(heroAngle);                  // Draai de held in de juiste richting
            ctx.drawImage(assets.hero, -26, -25, 42, 40); // Teken gecentreerd
            ctx.restore();

            // D. Kompas
            ctx.drawImage(assets.kompass, 180, 235, 55, 55);

            // E. HUD / Kamer informatie
            ctx.font = "bold 18px monospace";
            ctx.fillStyle = "#ffcc00";
            ctx.textAlign = "left";
            ctx.fillText("Room: " + room.roomNo, 155, 515);
            ctx.fillText("Tot: " + room.totRooms, 320, 515);
        }

        // 4. HULPFUNCTIE VOOR MUREN
        function drawWall(side, type, likes) {
            if (type === 0) return;

            ctx.save();

            if (side === 0) { // TOP MUUR
                if (type === 2) {
                    ctx.drawImage(assets.doorway, 275, 193, 50, 50);
                } else if (type === 1) {
                    ctx.drawImage(assets.door, 275, 193, 50, 50);
                    ctx.drawImage(assets.thumbsUp, 290, 170, 20, 20);
                    ctx.fillStyle = "#fff"; ctx.font = "14px monospace"; ctx.textAlign = "left";
                    ctx.fillText(likes, 315, 185);
                }
            } 
            else if (side === 1) { // RIGHT MUUR
                ctx.translate(432, 375); ctx.rotate(Math.PI / 2);
                if (type === 2) {
                    ctx.drawImage(assets.doorway, -50, -25, 50, 50);
                } else if (type === 1) {
                    ctx.drawImage(assets.door, -50, -25, 50, 50);
                }
                ctx.restore();
                if (type === 1) {
                    ctx.drawImage(assets.thumbsUp, 450, 340, 20, 20);
                    ctx.fillStyle = "#fff"; ctx.font = "14px monospace"; ctx.textAlign = "left";
                    ctx.fillText(likes, 475, 355);
                }
            } 
            else if (side === 2) { // BOTTOM MUUR
                ctx.translate(275, 532); ctx.rotate(Math.PI);
                if (type === 2) {
                    ctx.drawImage(assets.doorway, -50, 25, 50, 50);
                } else if (type === 1) {
                    ctx.drawImage(assets.door, -50, 25, 50, 50);
                }
                ctx.restore();
                if (type === 1) {
                    ctx.drawImage(assets.thumbsDown, 250, 510, 20, 20);
                    ctx.fillStyle = "#fff"; ctx.font = "14px monospace"; ctx.textAlign = "left";
                    ctx.fillText(likes, 275, 525);
                }
            } 
            else if (side === 3) { // LEFT MUUR
                ctx.translate(168, 325); ctx.rotate(-Math.PI / 2);
                if (type === 2) {
                    ctx.drawImage(assets.doorway, -50, -25, 50, 50);
                } else if (type === 1) {
                    ctx.drawImage(assets.door, -50, -25, 50, 50);
                }
                ctx.restore();
                if (type === 1) {
                    ctx.drawImage(assets.thumbsUp, 130, 340, 20, 20);
                    ctx.fillStyle = "#fff"; ctx.font = "14px monospace"; ctx.textAlign = "left";
                    ctx.fillText(likes, 115, 355);
                }
            }
            ctx.restore();
        }

        // 5. KLIK-DETECTIE
        canvas.addEventListener("click", function(event) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            const room = rooms[currentRoomId];

            let clickedSide = -1;
            if (mouseX >= 250 && mouseX <= 350 && mouseY >= 200 && mouseY <= 250) clickedSide = 0;
            else if (mouseX >= 400 && mouseX <= 450 && mouseY >= 340 && mouseY <= 390) clickedSide = 1;
            else if (mouseX >= 250 && mouseX <= 350 && mouseY >= 490 && mouseY <= 540) clickedSide = 2;
            else if (mouseX >= 140 && mouseX <= 190 && mouseY >= 340 && mouseY <= 390) clickedSide = 3;

            if (clickedSide !== -1 && room.doorWayStat[clickedSide] === 2) {
                let nextRoomId = null;
                let newEntrySide = 2;

                if (clickedSide === 0) {
                    nextRoomId = room.targetRooms.top;
                    newEntrySide = 2; // Binnenkomend via onderste deur in de volgende kamer
                } else if (clickedSide === 1) {
                    nextRoomId = room.targetRooms.right;
                    newEntrySide = 3; // Binnenkomend via linker deur in de volgende kamer
                } else if (clickedSide === 2) {
                    nextRoomId = room.targetRooms.bottom;
                    newEntrySide = 0; // Binnenkomend via bovenste deur in de volgende kamer
                } else if (clickedSide === 3) {
                    nextRoomId = room.targetRooms.left;
                    newEntrySide = 1; // Binnenkomend via rechter deur in de volgende kamer
                }

                if (nextRoomId !== null && rooms[nextRoomId] !== undefined) {
                    changeRoom(nextRoomId, newEntrySide);
                }
            }
        });

        function changeRoom(newId, newEntry) {
            canvas.style.opacity = 0;
            setTimeout(() => {
                currentRoomId = newId;
                entrySide = newEntry;
                drawRoom(currentRoomId, entrySide);
                saveDungeonData();
                canvas.style.opacity = 1;
            }, 200);
        }
    </script>

</body>
</html>
