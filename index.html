<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Prototype - 3 Muur-statussen</title>
    <style>
        body {
            background-color: #8B0000;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #game-container {
            position: relative;
            width: 600px;
            height: 600px;
            border: 4px solid #333;
            background-color: #5B5B00;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="550"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 1. AFBEELDINGEN LADEN
        const assets = {
            room: new Image(),
            door: new Image(),
            doorway: new Image(),
            hero: new Image(),
            kompass: new Image(),
            thumbsUp: new Image(),
            thumbsDown: new Image()
        };

        assets.room.src = "EmptyRoom.png";
        assets.door.src = "Door.png";
        assets.doorway.src = "DoorWay.png";
        assets.hero.src = "Hero.png";
        assets.kompass.src = "Kompass.png";
        assets.thumbsUp.src = "ThumbsUp.png";
        assets.thumbsDown.src = "ThumbsDown.png";

        // 2. KAMER DATA-STRUCTUUR
        // doorWayStat waarden: 
        // 0 = Blinde muur (geen deur/geen opening)
        // 1 = Dichte deur (met puzzel/scores)
        // 2 = Open deurgat (vrije doorgang)
        const rooms = {
            0: {
                roomNo: 0,
                totRooms: 1,
                kompassRotation: 0,
                doorWayStat: [2, 1, 0, 1], // Top = open deurgat (2), Rechts = dichte deur (1), Onder = blinde muur (0), Links = open deurgat (2)
                likes: [0, 1, 0, 3],       
                dislikes: [0, 0, 0, 0],    
                puzzleSolved: [true, false, false, false],
                targetRooms: {
                    top: 1,
                    right: null,
                    bottom: null,
                    left: null
                }
            }
        };

        let currentRoomId = 0;

        let loadedImages = 0;
        const totalImages = Object.keys(assets).length;

        for (let key in assets) {
            assets[key].onload = () => {
                loadedImages++;
                if (loadedImages === totalImages) {
                    drawRoom(currentRoomId);
                }
            };
        }

        // 3. GENERIEKE TEKEN-FUNCTIE VOOR ELKE KAMER
        function drawRoom(roomId) {
            const room = rooms[roomId];
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // A. Achtergrond
            ctx.drawImage(assets.room, 150, 200, 300, 300);

            // B. Loop door alle 4 de muren (0=Top, 1=Right, 2=Bottom, 3=Left)
            for (let side = 0; side < 4; side++) {
                if (roomId === 0 && side === 2) {
                    continue; // Zuidmuur in kamer 0 blijft altijd een dichte/blinde muur
                }
                drawWall(side, room.doorWayStat[side], room.likes[side], room.puzzleSolved[side]);
            }

            // C. Held plaatsen
            ctx.drawImage(assets.hero, 277, 430, 52, 50);

            // D. Kompas
            ctx.drawImage(assets.kompass, 180, 235, 55, 55);

            // E. Kamer informatie HUD
            ctx.font = "bold 18px monospace";
            ctx.fillStyle = "#ffcc00";
            ctx.textAlign = "left";
            ctx.fillText("Room: " + room.roomNo, 155, 515);
            ctx.fillText("Tot: " + room.totRooms, 320, 515);
        }

        // 4. HULPFUNCTIE MET DE 3 STATUSSEN (0 = Blinde muur, 1 = Deur, 2 = Deurgat)
        function drawWall(side, type, likes, solved) {
            // Als type === 0 (Blinde muur), teken dan helemaal niets en sluit af
            if (type === 0) return;

            ctx.save();

            if (side === 0) { // TOP MUUR
                if (type === 2) {
                    ctx.drawImage(assets.doorway, 275, 194, 50, 50);
                } else if (type === 1) {
                    ctx.drawImage(assets.door, 275, 194, 50, 50);
                }
                ctx.restore(); 
                
                // Teken UI alleen bij een dichte deur (type 1)
                if (type === 1) {
                    ctx.drawImage(assets.thumbsUp, 290, 170, 20, 20);
                    ctx.fillStyle = "#fff";
                    ctx.font = "14px monospace";
                    ctx.textAlign = "left";
                    ctx.fillText(likes, 315, 185);
                }
            } 
            else if (side === 1) { // RIGHT MUUR (Rechts)
                ctx.translate(432, 375);
                ctx.rotate(Math.PI / 2);
                if (type === 2) {
                    ctx.drawImage(assets.doorway, -50, -25, 50, 50);
                } else if (type === 1) {
                    ctx.drawImage(assets.door, -50, -25, 50, 50);
                }
                ctx.restore();

                if (type === 1) {
                    ctx.drawImage(assets.thumbsUp, 450, 340, 20, 20);
                    ctx.fillStyle = "#fff";
                    ctx.font = "14px monospace";
                    ctx.textAlign = "left";
                    ctx.fillText(likes, 475, 355);
                }
            } 
            else if (side === 2) { // BOTTOM MUUR (Onder)
                ctx.translate(275, 532);
                ctx.rotate(Math.PI);
                if (type === 2) {
                    ctx.drawImage(assets.doorway, -50, 25, 50, 50);
                } else if (type === 1) {
                    ctx.drawImage(assets.door, -50, 25, 50, 50);
                }
                ctx.restore();

                if (type === 1) {
                    ctx.drawImage(assets.thumbsDown, 250, 510, 20, 20);
                    ctx.fillStyle = "#fff";
                    ctx.font = "14px monospace";
                    ctx.textAlign = "left";
                    ctx.fillText(likes, 275, 525);
                }
            } 
            else if (side === 3) { // LEFT MUUR (Links)
                ctx.translate(168, 325);
                ctx.rotate(-Math.PI / 2);
                if (type === 2) {
                    ctx.drawImage(assets.doorway, -50, -25, 50, 50);
                } else if (type === 1) {
                    ctx.drawImage(assets.door, -50, -25, 50, 50);
                }
                ctx.restore();

                if (type === 1) {
                    ctx.drawImage(assets.thumbsUp, 130, 340, 20, 20);
                    ctx.fillStyle = "#fff";
                    ctx.font = "14px monospace";
                    ctx.textAlign = "left";
                    ctx.fillText(likes, 115, 355);
                }
            }
        }
    </script>

</body>
</html>
