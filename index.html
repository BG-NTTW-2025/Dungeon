<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Editor - Zwaard in Kamer 3</title>
    <style>
        body {
            background-color: #8B0000;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 600px;
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            padding: 0 5px;
        }
        #top-bar button {
            background: #444;
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 4px 10px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
        }
        #top-bar button:hover {
            background: #666;
        }
        #inventory-bar {
            font-size: 14px;
            color: #00ffff;
            margin-bottom: 5px;
            padding: 0 5px;
            font-weight: bold;
        }
        canvas {
            display: block;
            width: 600px;
            height: 550px;
            // border: 4px solid #333;
            background-color: #8B0000; /* Achtergrond rood gemaakt i.p.v. groen */
            opacity: 1;
            transition: opacity 0.2s ease-in-out;
        }
        #puzzle-box {
            display: none;
            position: absolute;
            top: 80px;
            left: 10px;
            width: 580px;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffcc00;
            padding: 0 15px 15px 15px;
            box-sizing: border-box;
            font-family: monospace;
            color: #fff;
            z-index: 10;
        }
        #puzzle-handle {
            display: flex;
            align-items: center;
            background-color: #333;
            margin: 0 -15px 15px -15px;
            padding: 8px 12px;
            cursor: grab;
            border-bottom: 2px solid #ffcc00;
        }
        #puzzle-handle:active {
            cursor: grabbing;
        }
        .handle-dot {
            width: 14px;
            height: 14px;
            background-color: #ffd700;
            border-radius: 50%;
            margin-right: 10px;
        }
        .window-title {
            color: #ffd700;
            font-weight: bold;
            font-size: 14px;
        }
        #close-btn {
            position: absolute;
            top: 6px;
            right: 12px;
            background: #cc0000;
            color: #fff;
            border: none;
            width: 26px;
            height: 26px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
        }
        #close-btn:hover {
            background: #ff1a1a;
        }
        #puzzle-box p {
            margin: 0 0 10px 0;
            font-size: 14px;
            line-height: 1.4;
            color: #ffcc00;
            padding-right: 25px;
        }
        .action-row {
            margin-top: 10px;
        }
        #puzzle-box input {
            padding: 5px;
            font-size: 16px;
            font-family: monospace;
            width: 70%;
            background: #222;
            color: #ffcc00;
            border: 1px solid #ffcc00;
        }
        #puzzle-box button.answer-btn {
            padding: 6px 12px;
            font-family: monospace;
            background: #ffcc00;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
            color: #000;
        }
        #puzzle-feedback {
            margin-top: 8px;
            font-size: 13px;
            font-weight: bold;
        }
        #puzzle-hint {
            margin-top: 6px;
            font-size: 12px;
            color: #00ffff;
            font-style: italic;
        }
        #solution-container {
            display: none;
            margin-top: 8px;
        }
        #solution-btn {
            background: #008b8b;
            color: #fff;
            border: 1px solid #00ffff;
            padding: 4px 8px;
            font-family: monospace;
            cursor: pointer;
            font-weight: bold;
        }
        #solution-btn:hover {
            background: #00abab;
        }
        .rating-container {
            display: none;
            margin-top: 12px;
            border-top: 1px dashed #555;
            padding-top: 8px;
            font-size: 12px;
        }
        .rating-container button {
            background: #222;
            border: 1px solid #777;
            color: #fff;
            cursor: pointer;
            padding: 4px 10px;
            margin: 0 5px;
            font-family: monospace;
            font-weight: bold;
        }
        .rating-container button:hover {
            border-color: #ffcc00;
            background: #333;
        }
        #rating-score {
            font-weight: bold;
            font-size: 14px;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="top-bar">
            <span>Dungeon Game</span>
            <button onclick="resetGameData()">Reset Game</button>
        </div>
        <div id="inventory-bar">
            Inventory: <span id="inventory-content">Geen</span>
        </div>

        <canvas id="gameCanvas" width="600" height="550"></canvas>
        
        <div id="puzzle-box">
            <div id="puzzle-handle">
                <span class="handle-dot"></span>
                <span class="window-title">Raadsels & Opdrachten</span>
            </div>
            <button id="close-btn" onclick="closePuzzle()">×</button>
            <p id="puzzle-question"></p>
            <div class="action-row" id="puzzle-input-row">
                <input type="text" id="puzzle-input" placeholder="Typ je antwoord...">
                <button class="answer-btn" onclick="checkPuzzleAnswer()">Beantwoord</button>
            </div>
            <div id="puzzle-hint"></div>
            <div id="solution-container">
                <button id="solution-btn" onclick="revealSolution()">Toon oplossing</button>
            </div>
            <div id="puzzle-feedback"></div>
            
            <div class="rating-container" id="rating-section">
                <span id="rating-text">Waardeer deze kamer:</span>
                <span id="voting-buttons">
                    <button onclick="rateRoom(1)">+1</button>
                    <button onclick="rateRoom(-1)">-1</button>
                </span>
                <span id="rating-score">0</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const assetFiles = {
            room: "EmptyRoom.png",
            door: "Door.png",
            doorway: "DoorWay.png",
            hero: "Hero.png",
            kompass: "Kompass.png",
            monster: "Mnstr_0.png",
            redKey: "RedKey.png",
            sword: "Sword.png"
        };

        const assets = {};
        let loadedImages = 0;
        const totalImages = Object.keys(assetFiles).length;

        function initAssets() {
            for (let key in assetFiles) {
                assets[key] = new Image();
                assets[key].src = assetFiles[key];
                assets[key].onload = () => checkAllLoaded();
                assets[key].onerror = () => {
                    console.warn("Kon afbeelding niet laden: " + assetFiles[key]);
                    checkAllLoaded();
                };
            }
        }

        function checkAllLoaded() {
            loadedImages++;
            if (loadedImages === totalImages) {
                drawRoom(currentRoomId, entrySide);
                updateInventoryUI();
            }
        }

        const defaultDungeon = {
            0: {
                roomNo: 0, totRooms: 4,
                doorWayStat: [2, 2, 0, 2], 
                likes: 0, hasVoted: false, puzzleSolved: [true, true, false, true],
                targetRooms: { top: 1, right: 2, bottom: null, left: 3 }
            },
            1: {
                roomNo: 1, totRooms: 4,
                doorWayStat: [1, 0, 2, 0], 
                likes: 0, hasVoted: false, puzzleSolved: [false, false, true, false],
                targetRooms: { top: null, right: null, bottom: 0, left: null }
            },
            2: {
                roomNo: 2, totRooms: 4,
                doorWayStat: [1, 0, 0, 2], 
                likes: 0, hasVoted: false, 
                monsterDefeated: false, monsterHp: 3, keyCollected: false,
                puzzleSolved: [false, false, false, true],
                targetRooms: { top: 4, right: null, bottom: null, left: 0 }
            },
            3: {
                roomNo: 3, totRooms: 4,
                doorWayStat: [1, 2, 0, 0], 
                likes: 0, hasVoted: false, 
                swordCollected: false,
                puzzleSolved: [false, true, false, false],
                targetRooms: { top: 5, right: 0, bottom: null, left: null }
            },
            4: {
                roomNo: 4, totRooms: 4,
                doorWayStat: [0, 0, 2, 0],
                likes: 0, hasVoted: false, puzzleSolved: [true, true, true, true],
                targetRooms: { top: null, right: null, bottom: 2, left: null }
            },
            5: {
                roomNo: 5, totRooms: 4,
                doorWayStat: [0, 0, 2, 0],
                likes: 0, hasVoted: false, puzzleSolved: [true, true, true, true],
                targetRooms: { top: null, right: null, bottom: 3, left: null }
            }
        };

        let rooms = JSON.parse(localStorage.getItem("dungeon_rooms")) || defaultDungeon;
        let inventory = JSON.parse(localStorage.getItem("dungeon_inventory")) || [];
        let currentRoomId = 0;
        let entrySide = 2;
        let activeActivity = null; 
        let failedAttempts = 0;

        function saveGameData() {
            localStorage.setItem("dungeon_rooms", JSON.stringify(rooms));
            localStorage.setItem("dungeon_inventory", JSON.stringify(inventory));
        }

        function resetGameData() {
            if (confirm("Weet je zeker dat je alle voortgang wilt resetten?")) {
                localStorage.removeItem("dungeon_rooms");
                localStorage.removeItem("dungeon_inventory");
                location.reload();
            }
        }

        initAssets();

        function updateInventoryUI() {
            const invContent = document.getElementById("inventory-content");
            if (inventory.length === 0) {
                invContent.innerText = "Geen";
                invContent.style.color = "#fff";
            } else {
                invContent.innerText = inventory.join(", ");
                invContent.style.color = "#ff4d4d";
            }
        }

        function drawRoom(roomId, entry) {
            const room = rooms[roomId];
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (assets.room.complete && assets.room.naturalWidth !== 0) {
                ctx.drawImage(assets.room, 150, 325, 300, 200);
            } else {
                ctx.fillStyle = "#4a4a00";
                ctx.fillRect(150, 325, 300, 200);
            }

            for (let side = 0; side < 4; side++) {
                drawWall(side, room.doorWayStat[side]);
            }

            if (roomId === 2) {
                if (!room.monsterDefeated) {
                    if (assets.monster.complete && assets.monster.naturalWidth !== 0) {
                        ctx.drawImage(assets.monster, 275, 348, 50, 50);
                    } else {
                        ctx.fillStyle = "#ff00ff"; ctx.fillRect(275, 348, 50, 50);
                    }
                } else if (!room.keyCollected) {
                    if (assets.redKey.complete && assets.redKey.naturalWidth !== 0) {
                        ctx.drawImage(assets.redKey, 285, 358, 30, 30);
                    } else {
                        ctx.fillStyle = "#ff0000"; ctx.fillRect(285, 358, 30, 30);
                    }
                }
            }

            if (roomId === 3 && !room.swordCollected) {
                if (assets.sword.complete && assets.sword.naturalWidth !== 0) {
                    ctx.drawImage(assets.sword, 285, 390, 30, 30);
                } else {
                    ctx.fillStyle = "#ffffff"; ctx.fillRect(285, 390, 30, 30);
                }
            }

            let heroX = 267, heroY = 350;
            let heroAngle = 0;

            if (entry === 0) { heroX = 267; heroY = 350; heroAngle = Math.PI; }
            else if (entry === 1) { heroX = 380; heroY = 395; heroAngle = -Math.PI / 2; }
            else if (entry === 2) { heroX = 282; heroY = 455; heroAngle = 0; }
            else if (entry === 3) { heroX = 170; heroY = 405; heroAngle = Math.PI / 2; }

            ctx.save();
            ctx.translate(heroX + 26, heroY + 25);
            ctx.rotate(heroAngle);
            if (assets.hero.complete && assets.hero.naturalWidth !== 0) {
                ctx.drawImage(assets.hero, -26, -25, 42, 40);
            } else {
                ctx.fillStyle = "#00ffff"; ctx.fillRect(-15, -15, 30, 30);
            }
            ctx.restore();

            if (assets.kompass.complete && assets.kompass.naturalWidth !== 0) {
                ctx.drawImage(assets.kompass, 480, 335, 55, 55);
            }

            ctx.font = "bold 18px monospace";
            ctx.fillStyle = "#ffcc00";
            ctx.textAlign = "left";
            ctx.fillText("Room: " + room.roomNo, 155, 540);
            ctx.fillText("Tot: " + room.totRooms, 320, 540);
        }

        function drawWall(side, type) {
            if (type === 0) return;
            let imgToUse = (type === 2) ? assets.doorway : assets.door;

            ctx.save();
            if (side === 0) { 
                ctx.drawImage(imgToUse, 275, 318, 50, 50);
            } 
            else if (side === 1) { 
                ctx.translate(432, 450); ctx.rotate(Math.PI / 2);
                ctx.drawImage(imgToUse, -50, -25, 50, 50);
            } 
            else if (side === 2) { 
                ctx.translate(275, 557); ctx.rotate(Math.PI);
                ctx.drawImage(imgToUse, -50, 25, 50, 50);
            } 
            else if (side === 3) { 
                ctx.translate(168, 400); ctx.rotate(-Math.PI / 2);
                ctx.drawImage(imgToUse, -50, -25, 50, 50);
            }
            ctx.restore();
        }

        canvas.addEventListener("click", function(event) {
            if (activeActivity !== null) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            const room = rooms[currentRoomId];

            if (currentRoomId === 2 && !room.monsterDefeated) {
                if (mouseX >= 275 && mouseX <= 325 && mouseY >= 348 && mouseY <= 398) {
                    activeActivity = "monster";
                    document.getElementById("puzzle-question").innerText = "Een woest monster verspert de toegang!\n(Klik herhaaldelijk in dit scherm om het monster te bevechten)";
                    document.getElementById("puzzle-input-row").style.display = "none";
                    document.getElementById("puzzle-hint").innerText = "Resterende HP van monster: " + room.monsterHp;
                    document.getElementById("solution-container").style.display = "none";
                    document.getElementById("puzzle-feedback").innerText = "Het gevecht is begonnen! Klik op deze tekst of ergens in het vak om aan te vallen.";
                    document.getElementById("puzzle-feedback").style.color = "#ffcc00";
                    document.getElementById("rating-section").style.display = "none";

                    document.getElementById("puzzle-box").onclick = attackMonsterDirect;
                    document.getElementById("puzzle-box").style.display = "block";
                    return;
                }
            }

            if (currentRoomId === 2 && room.monsterDefeated && !room.keyCollected) {
                if (mouseX >= 285 && mouseX <= 315 && mouseY >= 358 && mouseY <= 388) {
                    room.keyCollected = true;
                    inventory.push("Rode Sleutel");
                    saveGameData();
                    updateInventoryUI();
                    drawRoom(currentRoomId, entrySide);

                    activeActivity = "info";
                    document.getElementById("puzzle-question").innerText = "Voorwerp opgepakt!";
                    document.getElementById("puzzle-input-row").style.display = "none";
                    document.getElementById("puzzle-hint").innerText = "";
                    document.getElementById("solution-container").style.display = "none";
                    document.getElementById("puzzle-feedback").style.color = "#00ff00";
                    document.getElementById("puzzle-feedback").innerText = "Je hebt de rode sleutel opgepakt en toegevoegd aan je inventory.";
                    document.getElementById("rating-section").style.display = "none";
                    document.getElementById("puzzle-box").onclick = null;
                    document.getElementById("puzzle-box").style.display = "block";
                    return;
                }
            }

            if (currentRoomId === 3 && !room.swordCollected) {
                if (mouseX >= 285 && mouseX <= 315 && mouseY >= 390 && mouseY <= 420) {
                    room.swordCollected = true;
                    inventory.push("Zwaard");
                    saveGameData();
                    updateInventoryUI();
                    drawRoom(currentRoomId, entrySide);

                    activeActivity = "info";
                    document.getElementById("puzzle-question").innerText = "Voorwerp opgepakt!";
                    document.getElementById("puzzle-input-row").style.display = "none";
                    document.getElementById("puzzle-hint").innerText = "";
                    document.getElementById("solution-container").style.display = "none";
                    document.getElementById("puzzle-feedback").style.color = "#00ff00";
                    document.getElementById("puzzle-feedback").innerText = "Je hebt het zwaard opgepakt en toegevoegd aan je inventory.";
                    document.getElementById("rating-section").style.display = "none";
                    document.getElementById("puzzle-box").onclick = null;
                    document.getElementById("puzzle-box").style.display = "block";
                    return;
                }
            }

            let clickedSide = -1;
            if (mouseX >= 270 && mouseX <= 330 && mouseY >= 325 && mouseY <= 360) clickedSide = 0;
            else if (mouseX >= 400 && mouseX <= 450 && mouseY >= 395 && mouseY <= 455) clickedSide = 1;
            else if (mouseX >= 270 && mouseX <= 330 && mouseY >= 495 && mouseY <= 530) clickedSide = 2;
            else if (mouseX >= 140 && mouseX <= 190 && mouseY >= 395 && mouseY <= 455) clickedSide = 3;

            if (clickedSide !== -1) {
                if (currentRoomId === 1 && clickedSide === 0 && !room.puzzleSolved[0]) {
                    activeActivity = "puzzle";
                    failedAttempts = 0;
                    document.getElementById("puzzle-box").onclick = null;
                    document.getElementById("puzzle-question").innerText = "Een oude stem fluistert:\n'Wat volgt je overal waar je gaat, maar verdwijnt zodra het licht uitgaat?'";
                    document.getElementById("puzzle-input-row").style.display = "block";
                    document.getElementById("puzzle-input").value = "";
                    document.getElementById("puzzle-feedback").innerText = "";
                    document.getElementById("puzzle-hint").innerText = "";
                    document.getElementById("solution-container").style.display = "none";
                    
                    if (room.puzzleSolved[0]) {
                        updateRatingUI(room);
                        document.getElementById("rating-section").style.display = "block";
                    } else {
                        document.getElementById("rating-section").style.display = "none";
                    }

                    document.getElementById("puzzle-box").style.display = "block";
                    document.getElementById("puzzle-input").focus();
                    return;
                }

                if (currentRoomId === 3 && clickedSide === 0 && room.doorWayStat[0] === 1) {
                    if (inventory.includes("Rode Sleutel")) {
                        inventory = inventory.filter(item => item !== "Rode Sleutel");
                        room.doorWayStat[0] = 2; 
                        saveGameData();
                        updateInventoryUI();
                        drawRoom(currentRoomId, entrySide);

                        activeActivity = "info";
                        document.getElementById("puzzle-question").innerText = "Deur geopend!";
                        document.getElementById("puzzle-input-row").style.display = "none";
                        document.getElementById("puzzle-hint").innerText = "";
                        document.getElementById("solution-container").style.display = "none";
                        document.getElementById("puzzle-feedback").style.color = "#00ff00";
                        document.getElementById("puzzle-feedback").innerText = "Je gebruikt de speciale rode sleutel om de deur te openen. De sleutel is uit je inventory verdwenen.";
                        document.getElementById("rating-section").style.display = "none";
                        document.getElementById("puzzle-box").onclick = null;
                        document.getElementById("puzzle-box").style.display = "block";
                        return;
                    } else {
                        activeActivity = "info";
                        document.getElementById("puzzle-question").innerText = "Gesloten deur";
                        document.getElementById("puzzle-input-row").style.display = "none";
                        document.getElementById("puzzle-hint").innerText = "";
                        document.getElementById("solution-container").style.display = "none";
                        document.getElementById("puzzle-feedback").style.color = "#ff4d4d";
                        document.getElementById("puzzle-feedback").innerText = "Open de deur met de speciale rode sleutel.";
                        document.getElementById("rating-section").style.display = "none";
                        document.getElementById("puzzle-box").onclick = null;
                        document.getElementById("puzzle-box").style.display = "block";
                        return;
                    }
                }

                if (room.doorWayStat[clickedSide] === 2) {
                    let nextRoomId = null;
                    let newEntrySide = 2;

                    if (clickedSide === 0) { nextRoomId = room.targetRooms.top; newEntrySide = 2; }
                    else if (clickedSide === 1) { nextRoomId = room.targetRooms.right; newEntrySide = 3; }
                    else if (clickedSide === 2) { nextRoomId = room.targetRooms.bottom; newEntrySide = 0; }
                    else if (clickedSide === 3) { nextRoomId = room.targetRooms.left; newEntrySide = 1; }

                    if (nextRoomId !== null && rooms[nextRoomId] !== undefined) {
                        changeRoom(nextRoomId, newEntrySide);
                    }
                }
            }
        });

        function attackMonsterDirect(event) {
            if (event.target.id === "close-btn") return;

            let room = rooms[currentRoomId];
            if (room.monsterDefeated) return;

            room.monsterHp--;

            if (room.monsterHp > 0) {
                document.getElementById("puzzle-hint").innerText = "Resterende HP van monster: " + room.monsterHp;
                document.getElementById("puzzle-feedback").style.color = "#ffcc00";
                document.getElementById("puzzle-feedback").innerText = "Je haalt uit naar het monster! (Nog " + room.monsterHp + " slagen te gaan)";
            } else {
                room.monsterDefeated = true;
                room.doorWayStat[0] = 2; 
                saveGameData();
                drawRoom(currentRoomId, entrySide);
                
                document.getElementById("puzzle-hint").innerText = "";
                document.getElementById("puzzle-feedback").style.color = "#00ff00";
                document.getElementById("puzzle-feedback").innerText = "Monster verslagen! De deur is open en er verschijnt een rode sleutel.";
                document.getElementById("puzzle-box").onclick = null;
            }
        }

        function checkPuzzleAnswer() {
            let antwoord = document.getElementById("puzzle-input").value.trim().toLowerCase();
            let room = rooms[currentRoomId];
            let feedback = document.getElementById("puzzle-feedback");
            let hint = document.getElementById("puzzle-hint");

            if (antwoord === "schaduw") {
                solvePuzzleSuccessfully(room);
            } else {
                failedAttempts++;
                feedback.style.color = "#ff4d4d";
                feedback.innerText = "Dat is niet juist! De deur blijft gesloten.";

                if (failedAttempts >= 1) {
                    hint.innerText = "Hint: Denk aan de zon en een donkere muur...";
                }

                if (failedAttempts >= 3) {
                    document.getElementById("solution-container").style.display = "block";
                }

                document.getElementById("puzzle-input").value = "";
                document.getElementById("puzzle-input").focus();
            }
        }

        function revealSolution() {
            let room = rooms[currentRoomId];
            document.getElementById("puzzle-input").value = "schaduw";
            document.getElementById("solution-container").style.display = "none";
            document.getElementById("puzzle-hint").innerText = "Het juiste antwoord is automatisch ingevuld.";
            checkPuzzleAnswer();
        }

        function solvePuzzleSuccessfully(room) {
            let feedback = document.getElementById("puzzle-feedback");
            let hint = document.getElementById("puzzle-hint");

            feedback.style.color = "#00ff00";
            feedback.innerText = "Juist! De deur opent zich...";
            hint.innerText = "";
            document.getElementById("solution-container").style.display = "none";
            
            updateRatingUI(room);
            document.getElementById("rating-section").style.display = "block";

            room.puzzleSolved[0] = true;
            room.doorWayStat[0] = 2; 
            saveGameData();
            drawRoom(currentRoomId, entrySide);
        }

        function closePuzzle() {
            document.getElementById("puzzle-box").style.display = "none";
            document.getElementById("puzzle-box").onclick = null;
            activeActivity = null;
        }

        function updateRatingUI(room) {
            let scoreElem = document.getElementById("rating-score");
            let buttonsElem = document.getElementById("voting-buttons");
            let textElem = document.getElementById("rating-text");

            scoreElem.innerText = room.likes;
            
            if (room.likes < 0) {
                scoreElem.style.color = "#ff4d4d";
            } else {
                scoreElem.style.color = "#ffcc00";
            }

            if (room.hasVoted) {
                buttonsElem.style.display = "none";
                textElem.innerText = "Waardering kamer:";
            } else {
                buttonsElem.style.display = "inline";
                textElem.innerText = "Waardeer deze kamer:";
            }
        }

        function rateRoom(value) {
            let room = rooms[currentRoomId];
            if (!room.hasVoted) {
                room.likes += value;
                room.hasVoted = true;
                saveGameData();
                updateRatingUI(room);
            }
        }

        function changeRoom(newId, newEntry) {
            canvas.style.opacity = 0;
            setTimeout(() => {
                currentRoomId = newId;
                entrySide = newEntry;
                drawRoom(currentRoomId, entrySide);
                saveGameData();
                canvas.style.opacity = 1;
            }, 200);
        }

// Sleepfunctionaliteit voor het puzzle/info-venster (voor muis én touchscreen)
        const puzzleBox = document.getElementById('puzzle-box');
        const puzzleHandle = document.getElementById('puzzle-handle');

        let isDraggingBox = false;
        let startXBox, startYBox;

        // Start verslepen (Muis)
        puzzleHandle.addEventListener('mousedown', (e) => {
            if (e.target.id === 'close-btn') return;
            isDraggingBox = true;
            startXBox = e.clientX - puzzleBox.offsetLeft;
            startYBox = e.clientY - puzzleBox.offsetTop;
            
            document.addEventListener('mousemove', onBoxMouseMove);
            document.addEventListener('mouseup', onBoxMouseUp);
        });

        // Start verslepen (Touchscreen / Tablet)
        puzzleHandle.addEventListener('touchstart', (e) => {
            if (e.target.id === 'close-btn') return;
            isDraggingBox = true;
            let touch = e.touches[0];
            startXBox = touch.clientX - puzzleBox.offsetLeft;
            startYBox = touch.clientY - puzzleBox.offsetTop;
            
            document.addEventListener('touchmove', onBoxTouchMove);
            document.addEventListener('touchend', onBoxTouchEnd);
        }, { passive: true });

        function onBoxMouseMove(e) {
            if (!isDraggingBox) return;
            puzzleBox.style.left = (e.clientX - startXBox) + 'px';
            puzzleBox.style.top = (e.clientY - startYBox) + 'px';
        }

        function onBoxTouchMove(e) {
            if (!isDraggingBox) return;
            let touch = e.touches[0];
            puzzleBox.style.left = (touch.clientX - startXBox) + 'px';
            puzzleBox.style.top = (touch.clientY - startYBox) + 'px';
        }

        function onBoxMouseUp() {
            isDraggingBox = false;
            document.removeEventListener('mousemove', onBoxMouseMove);
            document.removeEventListener('mouseup', onBoxMouseUp);
        }

        function onBoxTouchEnd() {
            isDraggingBox = false;
            document.removeEventListener('touchmove', onBoxTouchMove);
            document.removeEventListener('touchend', onBoxTouchEnd);
        }
    </script>

</body>
</html>
