name: Keep Supabase Alive

on:
  schedule:
    # Dit draait automatisch elke zondag en woensdag om 00:00 UTC
    - cron: '0 0 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/room_id?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPabase_KEY }}"
