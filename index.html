<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzel Indienen</title>
    <!-- Supabase JS Client -->
	<!-- Supabase JS Client met cache-buster -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=999"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; background-color: #fdfbf7; }
        label, textarea, input { display: block; width: 100%; margin-bottom: 5px; }
        textarea, input { margin-bottom: 15px; padding: 8px; box-sizing: border-box; }
        .char-count { font-size: 0.8em; color: #666; margin-top: -10px; margin-bottom: 15px; text-align: right; }
        button { background-color: #4a6fa5; color: white; padding: 10px; border: none; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <h2>Dien een nieuwe puzzel in</h2>
    <form id="puzzleForm">
        <label>Puzzelvraag (max 200 tekens):</label>
        <textarea id="question" maxlength="200" rows="4" required></textarea>
        <div id="qCount" class="char-count">0 / 200</div>
        
        <label>Oplossing (max 100 tekens):</label>
        <input type="text" id="solution" maxlength="100" required>
        <div id="sCount" class="char-count">0 / 100</div>
        
        <button type="submit">Puzzel Opslaan</button>
    </form>

    <script>
	console.log("HÉ! IK LAAD DE NIEUWE VERSIE!");
        // Initialiseer Supabase op de juiste manier
        const supabaseUrl = 'https://mgqoxmnryqekrpjglffb.supabase.co/';
        const supabaseKey = 'sb_publishable_btgAerx5A8O7urSEflRDAg_8NSdtoOu';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
	 //	  const supabase = supabase.createClient(supabaseUrl, supabaseKey);
	 
	

        // Live teken tellers voor extra gebruiksgemak
        const qInput = document.getElementById('question');
        const sInput = document.getElementById('solution');
        const qCount = document.getElementById('qCount');
        const sCount = document.getElementById('sCount');

        qInput.addEventListener('input', () => {
            qCount.textContent = `${qInput.value.length} / 200`;
        });
        sInput.addEventListener('input', () => {
            sCount.textContent = `${sInput.value.length} / 100`;
        });

        document.getElementById('puzzleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const question = document.getElementById('question').value;
            const solution = document.getElementById('solution').value;

            console.log("Bezig met verzenden...", question, solution);

            const { data, error } = await supabase
                .from('Puzzle_Labyrinth')
                .insert([{ 
                    question: question, 
                    solution: solution, 
                    likes: 0,
                    is_obsolete: false
                }]);

            if (error) {
                console.error("Supabase Error:", error);
                alert('Oeps, fout van Supabase: ' + error.message);
            } else {
                console.log("Succes!", data);
                alert('Puzzel succesvol opgeslagen in Supabase!');
                document.getElementById('puzzleForm').reset();
                qCount.textContent = "0 / 200";
                sCount.textContent = "0 / 100";
            }
        });
    </script>
</body>
</html>
