<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Game - Coördinaten Systeem</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .draggable-panel {
            position: absolute;
            background: #2b2b2b;
            border: 2px solid #555;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: default;
            user-select: none;
        }

        .panel-header {
            height: 30px;
            background: #444;
            color: #ffd700;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            cursor: grab;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }

        .panel-header:active {
            cursor: grabbing;
        }

        .panel-content {
            padding: 0;
        }

        #game-container { top: 50px; left: 50px; width: 340px; }

        .room-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 220px;
        }

        #room {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #333;
            background-image: url('Empty_Room.png');
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        #room-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }

        #room-content.fade-out { opacity: 0; }

        #hero {
            position: absolute;
            width: 32px;
            height: 32px;
            background-image: url('Hero.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            transition: left 0.1s, top 0.1s;
            z-index: 10;
        }

        .ui-panel { width: 320px; min-height: 150px; }
        #inventory-panel { top: 50px; left: 410px; width: 300px; }
        #quest-panel { top: 200px; left: 410px; width: 350px; max-height: 300px; overflow-y: auto; }
        #breadcrumb-panel { top: 520px; left: 410px; width: 350px; max-height: 220px; overflow-y: auto; }
        
        .door-asset { 
            cursor: pointer; 
            position: absolute; 
            width: 40px; 
            height: 40px; 
            z-index: 5; 
            transition: filter 0.2s;
        }

        .door-asset.selected {
            filter: drop-shadow(0 0 6px #ffd700);
        }

        .reset-btn {
            background: #c0392b;
            color: white;
            border: none;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .reset-btn:hover { background: #e74c3c; }

        .quest-box {
            padding: 12px;
            font-size: 13px;
            color: #ddd;
            line-height: 1.4;
        }

        .quest-box button {
            background: #3498db;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 6px;
            font-weight: bold;
        }
        .quest-box button:hover { background: #2980b9; }

        .quest-box button.danger {
            background: #c0392b;
        }
        .quest-box button.danger:hover {
            background: #e74c3c;
        }

        .inventory-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #4cd137;
        }

        .inventory-item img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .quest-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }

        .breadcrumb-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 6px 10px;
            margin-bottom: 4px;
            border-radius: 4px;
            font-size: 12px;
        }
        .breadcrumb-item button {
            background: #e67e22;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .breadcrumb-item button:hover { background: #d35400; }
    </style>
</head>
<body>

    <div id="game-container" class="draggable-panel" data-id="game-container">
        <div class="panel-header">
            <span id="game-header-title">Speelveld</span>
            <button class="reset-btn" onclick="resetGameCache()" title="Wis lokale cache en herlaad">Reset Cache</button>
        </div>
        <div class="panel-content">
            <div class="room-wrapper">
                <div id="room">
                    <div id="room-content">
                        <div id="hero"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="inventory-panel" class="draggable-panel ui-panel" data-id="inventory-panel">
        <div class="panel-header"><span>Inventory & Currency</span></div>
        <div id="inventory-content" class="panel-content" style="padding: 12px; font-size: 14px; color: #ccc;">
            <div class="inventory-item">
                <img src="rinth_symb.png" alt="Rinth" onerror="this.style.display='none'">
                <span>Rinths: <strong id="rinth-count" style="color: #ffd700;">10</strong></span>
            </div>
        </div>
    </div>

    <div id="quest-panel" class="draggable-panel ui-panel" data-id="quest-panel">
        <div class="panel-header"><span>Communicatie & Assignments</span></div>
        <div id="quest-content" class="panel-content quest-box">Click on a door to view the details. Click again to play the puzzle.</div>
    </div>

    <div id="breadcrumb-panel" class="draggable-panel ui-panel" data-id="breadcrumb-panel">
        <div class="panel-header"><span>Breadcrumbs (Laatste 10 kamers)</span></div>
        <div id="breadcrumb-content" class="panel-content quest-box">Nog geen kamers bezocht.</div>
    </div>
	
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- Status Player & currency ---
        let playerState = {
            score: 0,
            rinths: 10
        };

        function updatePlayerUI() {
            const rinthElem = document.getElementById('rinth-count');
            if (rinthElem) rinthElem.textContent = playerState.rinths;
        }
        updatePlayerUI();

        // --- Draggable Logic (Desktop & Touch) ---
        const panels = document.querySelectorAll('.draggable-panel');
        panels.forEach(panel => {
            const panelId = panel.getAttribute('data-id');
            const savedPos = localStorage.getItem('panel_pos_' + panelId);
            if (savedPos) {
                const pos = JSON.parse(savedPos);
                panel.style.left = pos.left + 'px';
                panel.style.top = pos.top + 'px';
            }

            const handle = panel.querySelector('.panel-header');
            let isDragging = false, startX, startY;

            function startDrag(clientX, clientY) {
                isDragging = true;
                startX = clientX - panel.offsetLeft;
                startY = clientY - panel.offsetTop;
                panel.style.zIndex = 1000;
            }

            function onDrag(clientX, clientY) {
                if (!isDragging) return;
                panel.style.left = (clientX - startX) + 'px';
                panel.style.top = (clientY - startY) + 'px';
            }

            handle.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                startDrag(e.clientX, e.clientY);
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => onDrag(e.clientX, e.clientY));
            document.addEventListener('mouseup', () => { isDragging = false; savePos(); });

            handle.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                const touch = e.touches[0];
                startDrag(touch.clientX, touch.clientY);
            });
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                onDrag(touch.clientX, touch.clientY);
            });
            document.addEventListener('touchend', () => { isDragging = false; savePos(); });

            function savePos() {
                localStorage.setItem('panel_pos_' + panelId, JSON.stringify({left: panel.offsetLeft, top: panel.offsetTop}));
            }
        });

        // --- Cache Reset Functie ---
        function resetGameCache() {
            if(confirm('Do you want to delete all local progress for this Dungeon and restart?')) {
                localStorage.removeItem('dungeon_unlocked_doors');
                localStorage.removeItem('dungeon_timer_states');
                localStorage.removeItem('dungeon_voted_doors');
                localStorage.removeItem('target_room');
                localStorage.removeItem('dungeon_breadcrumbs');
                location.reload();
            }
        }

        // --- Supabase Koppeling ---
        const supabaseUrl = 'https://mgqoxmnryqekrpjglffb.supabase.co';
        const supabaseKey = 'sb_publishable_btgAerx5A8O7urSEflRDAg_8NSdtoOu';
        const dbClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const oppositeSideMap = { 'north': 'south', 'east': 'west', 'south': 'north', 'west': 'east' };

        const wrongAttemptsTracker = {};
        let activeTimerInterval = null;

        function getTimerStateMap() {
            const saved = localStorage.getItem('dungeon_timer_states');
            return saved ? JSON.parse(saved) : {};
        }

        function setTimerState(doorKey, stateObj) {
            const map = getTimerStateMap();
            map[doorKey] = stateObj;
            localStorage.setItem('dungeon_timer_states', JSON.stringify(map));
        }

        function getTimerState(doorKey) {
            const map = getTimerStateMap();
            return map[doorKey] || null;
        }

        function getVotedDoorsMap() {
            const saved = localStorage.getItem('dungeon_voted_doors');
            return saved ? JSON.parse(saved) : {};
        }

        function markDoorVoted(doorKey) {
            const map = getVotedDoorsMap();
            map[doorKey] = true;
            localStorage.setItem('dungeon_voted_doors', JSON.stringify(map));
        }

        function hasVotedDoor(doorKey) {
            const map = getVotedDoorsMap();
            return !!map[doorKey];
        }

        function getLocalDoorStatus(x, y, wallSide) {
            const savedState = localStorage.getItem('dungeon_unlocked_doors');
            const stateMap = savedState ? JSON.parse(savedState) : {};
            return !!stateMap[x + '_' + y + '_' + wallSide];
        }

        function setLocalDoorStatus(posX, posY, wallSide) {
            const savedState = localStorage.getItem('dungeon_unlocked_doors');
            const stateMap = savedState ? JSON.parse(savedState) : {};
            
            stateMap[posX + '_' + posY + '_' + wallSide] = true;

            let targetX = posX;
            let targetY = posY;
            if (wallSide === 'north') targetY += 1;
            if (wallSide === 'south') targetY -= 1;
            if (wallSide === 'east') targetX += 1;
            if (wallSide === 'west') targetX -= 1;

            const oppSide = oppositeSideMap[wallSide];
            stateMap[targetX + '_' + targetY + '_' + oppSide] = true;

            localStorage.setItem('dungeon_unlocked_doors', JSON.stringify(stateMap));
        }

        // --- Broodkruimel Systeem (Breadcrumbs) ---
        function addBreadcrumb(roomId, posX, posY) {
            let crumbs = JSON.parse(localStorage.getItem('dungeon_breadcrumbs')) || [];
            crumbs = crumbs.filter(c => c.roomId !== roomId);
            crumbs.unshift({ roomId, posX, posY });
            if (crumbs.length > 10) crumbs.pop();
            localStorage.setItem('dungeon_breadcrumbs', JSON.stringify(crumbs));
            renderBreadcrumbs();
        }

        function renderBreadcrumbs() {
            const container = document.getElementById('breadcrumb-content');
            const crumbs = JSON.parse(localStorage.getItem('dungeon_breadcrumbs')) || [];
            
            if (crumbs.length === 0) {
                container.innerHTML = "Nog geen kamers bezocht.";
                return;
            }

            let html = '';
            crumbs.forEach(c => {
                html += '<div class="breadcrumb-item">' +
                        '<span>Room R-' + c.roomId + '</span>' +
                        '<button onclick="jumpToBreadcrumb(' + c.posX + ', ' + c.posY + ')">Escape Here</button>' +
                        '</div>';
            });
            container.innerHTML = html;
        }

        function jumpToBreadcrumb(posX, posY) {
            loadRoomByCoords(posX, posY, 'south');
        }

        function getFailAction(puzzle) {
            const val = puzzle.fail_action || puzzle.reveal_answer;
            if (val === 'no_answer' || val === 'no_reveal' || val === false || val === 'false') {
                return 'no_answer';
            }
            if (val === 'paid_answer' || val === 'paid') {
                return 'paid_answer';
            }
            return 'free_answer';
        }

        let selectedDoorKey = null;

        async function loadRoomByCoords(posX, posY, entrySide = 'south') {
            const roomContent = document.getElementById('room-content');
            selectedDoorKey = null;

            if (activeTimerInterval) clearInterval(activeTimerInterval);
            document.getElementById('quest-content').innerHTML = "Click on a door to view the details. Click again to play the puzzle.";
            
            const updateRoomContent = async () => {
                try {
                    const { data: puzzles, error: puzzleError } = await dbClient
                        .from('puzzle_labyrinth')
                        .select('*')
                        .eq('pos_x', posX)
                        .eq('pos_y', posY);

                    if (puzzleError) throw puzzleError;

                    const headerSpan = document.getElementById('game-header-title');
                    const roomId = puzzles?.[0]?.room_id || '?';
                    
                    if(headerSpan) {
                        headerSpan.innerHTML = 'Room ' + roomId + ' | Score: <strong style="color: #4cd137;">' + playerState.score + '</strong>';
                    }
                    
                    if (roomId !== '?') {
                        addBreadcrumb(roomId, posX, posY);
                    }
                    
                    const hero = document.getElementById('hero');
                    roomContent.innerHTML = ''; 
                    roomContent.appendChild(hero);

                    setHeroPosition(hero, entrySide);

                    if (puzzles && puzzles.length > 0) {
                        puzzles.forEach(puzzle => {
                            const img = document.createElement('img');
                            const wallSide = puzzle.wall_side;
                            const doorKey = posX + '_' + posY + '_' + wallSide;
                            img.setAttribute('data-doorkey', doorKey);

                            let targetX = posX;
                            let targetY = posY;
                            if (wallSide === 'north') targetY += 1;
                            if (wallSide === 'south') targetY -= 1;
                            if (wallSide === 'east') targetX += 1;
                            if (wallSide === 'west') targetX -= 1;

                            const hasActivePuzzle = puzzle.question && puzzle.question.trim() !== "";
                            let isSolved = !hasActivePuzzle || getLocalDoorStatus(posX, posY, wallSide);

                            img.src = isSolved ? 'DoorWay.png' : 'Door.png';
                            img.className = 'door-asset';
                            
                            setDoorPositionAndStyle(img, wallSide);

                            img.addEventListener('click', async () => {
                                const { data: freshData } = await dbClient
                                    .from('puzzle_labyrinth')
                                    .select('*')
                                    .eq('pos_x', posX)
                                    .eq('pos_y', posY)
                                    .eq('wall_side', wallSide)
                                    .single();

                                const liveHasPuzzle = freshData && freshData.question && freshData.question.trim() !== "";
                                const liveSolved = !liveHasPuzzle || getLocalDoorStatus(posX, posY, wallSide);

                                document.querySelectorAll('.door-asset').forEach(d => d.classList.remove('selected'));

                                if (liveSolved) {
                                    loadRoomByCoords(targetX, targetY, oppositeSideMap[wallSide]);
                                } else {
                                    const initialTimer = parseInt(freshData.google_timer) || 0;
                                    const timerState = getTimerState(doorKey);
                                    const isTimerExpired = initialTimer > 0 && timerState && timerState.expired;

                                    if (isTimerExpired) {
                                        selectedDoorKey = doorKey;
                                        img.classList.add('selected');
                                        triggerDoorPuzzle(freshData, doorKey, () => {});
                                    } else {
                                        if (selectedDoorKey !== doorKey) {
                                            selectedDoorKey = doorKey;
                                            img.classList.add('selected');
                                            showDoorInfo(freshData, doorKey);
                                        } else {
                                            triggerDoorPuzzle(freshData, doorKey, (success) => {
                                                if (success) {
                                                    setLocalDoorStatus(posX, posY, wallSide);
                                                    img.src = 'DoorWay.png';
                                                    selectedDoorKey = null;
                                                }
                                            });
                                        }
                                    }
                                }
                            });

                            roomContent.appendChild(img);
                        });
                    }

                } catch (err) { 
                    console.error("Error loading room at coordinates:", err); 
                }
            };

            if (entrySide === null) {
                await updateRoomContent();
            } else {
                roomContent.classList.add('fade-out');
                setTimeout(async () => { 
                    await updateRoomContent(); 
                    roomContent.classList.remove('fade-out'); 
                }, 300);
            }
        }

        function showDoorInfo(puzzle, doorKey) {
            let hintCount = 0;
            if (puzzle.hint_1 && puzzle.hint_1.trim() !== "") hintCount++;
            if (puzzle.hint_2 && puzzle.hint_2.trim() !== "") hintCount++;

            const failAction = getFailAction(puzzle);
            let failActionText = "Answer is revealed for free.";
            if (failAction === "no_answer") {
                failActionText = "The answer remains secret.";
            } else if (failAction === "paid_answer") {
                failActionText = "Paid answer (Rinths)";
            }

            const googleTimer = parseInt(puzzle.google_timer) || 0;
            const chickenPenalty = parseInt(puzzle.chicken_penalty) || 0;
            const wrongPenalty = parseInt(puzzle.wrong_penalty) || 0;
            const maxReward = puzzle.max_reward !== undefined && puzzle.max_reward !== null ? puzzle.max_reward : 30;

            const questContent = document.getElementById('quest-content');
            
            questContent.innerHTML = '<p><strong>Door found (' + puzzle.wall_side + ')</strong></p>' +
                '<p style="color: #ffd700; font-size: 12px; margin-bottom: 8px;">View the properties. Click the door again to start the puzzle.</p>' +
                '<ul style="padding-left: 15px; margin: 0; font-size: 12px; color: #ccc;">' +
                (googleTimer > 0 ? '<li><strong>Timer:</strong> ' + googleTimer + 's</li>' : '') +
                '<li><strong>Max Reward:</strong> ' + maxReward + '</li>' +
                (chickenPenalty > 0 ? '<li><strong>Chicken Penalty:</strong> ' + chickenPenalty + '</li>' : '') +
                (wrongPenalty > 0 ? '<li><strong>Wrong Penalty:</strong> ' + wrongPenalty + '</li>' : '') +
                '<li><strong>After 3 errors / time\'s up:</strong> ' + failActionText + '</li>' +
                '<li><strong>Hints available:</strong> ' + hintCount + '</li>' +
                '</ul>' +
                '<button onclick="confirmStartPuzzle()">Start Puzzle</button>';
        }

        function confirmStartPuzzle() {
            const selectedImg = document.querySelector('.door-asset.selected');
            if (selectedImg) selectedImg.click();
        }

        function setHeroPosition(hero, side) {
            const rotations = { 'north': '180deg', 'east': '-90deg', 'south': '0deg', 'west': '90deg' };
            switch(side) {
                case 'north': hero.style.left = '134px'; hero.style.top = '25px'; break;
                case 'east': hero.style.left = '235px'; hero.style.top = '84px'; break;
                case 'south': hero.style.left = '134px'; hero.style.top = '140px'; break;
                case 'west': hero.style.left = '30px'; hero.style.top = '84px'; break;
            }
            hero.style.transform = 'rotate(' + (rotations[side] || '0deg') + ')';
        }

        function setDoorPositionAndStyle(img, wallSide) {
            switch(wallSide) {
                case 'north': img.style.top = '0px'; img.style.left = '130px'; img.style.transform = 'rotate(0deg)'; break;
                case 'east': img.style.top = '80px'; img.style.left = '260px'; img.style.transform = 'rotate(90deg)'; break;
                case 'south': img.style.top = '160px'; img.style.left = '130px'; img.style.transform = 'rotate(180deg)'; break;
                case 'west': img.style.top = '80px'; img.style.left = '0px'; img.style.transform = 'rotate(-90deg)'; break;
            }
        }

        function triggerDoorPuzzle(puzzle, doorKey, callback) {
            const questContent = document.getElementById('quest-content');
            const q = puzzle.question || "Los de puzzle op:";
            const a = puzzle.answer ? String(puzzle.answer).trim() : "open";
            const failAction = getFailAction(puzzle);
            const chickenPenalty = parseInt(puzzle.chicken_penalty) || 0;
            const maxReward = parseInt(puzzle.max_reward) || 30;
            
            const initialTimer = parseInt(puzzle.google_timer) || 0;
            let timerState = getTimerState(doorKey);

            let timeLeft = initialTimer;
            let isExpired = false;

            if (timerState && initialTimer > 0) {
                isExpired = timerState.expired;
                timeLeft = timerState.timeLeft;
            }

            if (wrongAttemptsTracker[doorKey] === undefined) {
                wrongAttemptsTracker[doorKey] = 0;
            }

            if (activeTimerInterval) clearInterval(activeTimerInterval);

            function renderPuzzleScreen() {
                let wrongCount = wrongAttemptsTracker[doorKey];
                let hintsHtml = '';
                
                if (wrongCount >= 1 && puzzle.hint_1 && puzzle.hint_1.trim() !== "") {
                    hintsHtml += '<p style="font-size: 11px; color: #3498db; margin: 4px 0;"><strong>Hint 1:</strong> ' + puzzle.hint_1 + ' (' + (puzzle.hint_1_option || '') + ')</p>';
                }
                if (wrongCount >= 2 && puzzle.hint_2 && puzzle.hint_2.trim() !== "") {
                    hintsHtml += '<p style="font-size: 11px; color: #3498db; margin: 4px 0;"><strong>Hint 2:</strong> ' + puzzle.hint_2 + ' (' + (puzzle.hint_2_option || '') + ')</p>';
                }

                if (initialTimer > 0 && (isExpired || timeLeft <= 0)) {
                    if (activeTimerInterval) clearInterval(activeTimerInterval);
                    
                    let expiredHtml = '<p style="color: #ff6b6b; font-weight: bold;">The Google Timer has expired! Answers are no longer accepted.</p>';
                    
                    if (failAction === "free_answer") {
                        expiredHtml += '<button onclick="revealDoorAnswer(\'' + a + '\', \'' + doorKey + '\', ' + maxReward + ')">Reveal Answer (For Free)</button><br>';
                    } else if (failAction === "paid_answer") {
                        expiredHtml += '<button onclick="buyDoorAnswer(\'' + a + '\', \'' + doorKey + '\', 5, ' + maxReward + ')">Purchase Answer (5 Rinths)</button><br>';
                    } else {
                        expiredHtml += '<p style="font-size: 12px; color: #ccc;">The answer remains a secret behind this door.</p>';
                    }

                    const alreadyVoted = hasVotedDoor(doorKey);
                    if (!alreadyVoted) {
                        expiredHtml += '<p style="margin-top:12px; font-size:12px;">Rate this puzzle:</p>' +
                            '<div id="rating-buttons">' +
                            '<button style="background:transparent; border:none; cursor:pointer;" onclick="ratePuzzle(' + puzzle.id + ', 1, \'' + doorKey + '\')"><img src="like_green_symb.png" style="width:24px;" alt="Like" onerror="this.outerText=\'👍\'"></button>' +
                            '<button style="background:transparent; border:none; cursor:pointer;" onclick="ratePuzzle(' + puzzle.id + ', -1, \'' + doorKey + '\')"><img src="disLike_red_symb.png" style="width:24px;" alt="Dislike" onerror="this.outerText=\'👎\'"></button>' +
                            '</div>';
                    } else {
                        expiredHtml += '<p style="margin-top:12px; font-size:11px; color: #4cd137;">✔ You have already rated this puzzle.</p>';
                    }

                    questContent.innerHTML = '<div class="quest-header-flex">' +
                        '<span><strong>Question:</strong> ' + q + '</span>' +
                        (initialTimer > 0 ? '<span id="timer-display" style="color: #ffd700; font-weight: bold;"><img src="google_symb.png" style="width:16px; vertical-align:middle; margin-right:3px;" onerror="this.outerText=\'G\'"> <span id="time-val">0</span>s</span>' : '') +
                        '</div>' +
                        hintsHtml +
                        expiredHtml;
                    return;
                }

                if (wrongCount >= 3) {
                    if (activeTimerInterval) clearInterval(activeTimerInterval);
                    let maxActionsHtml = '<p style="color: #ff6b6b; font-weight: bold;">You made 3 mistakes!</p>';
                    
                    if (failAction === "free_answer") {
                        maxActionsHtml += '<button onclick="revealDoorAnswer(\'' + a + '\', \'' + doorKey + '\', ' + maxReward + ')">Reveal Answer (For Free)</button><br>';
                    } else if (failAction === "paid_answer") {
                        maxActionsHtml += '<button onclick="buyDoorAnswer(\'' + a + '\', \'' + doorKey + '\', 5, ' + maxReward + ')">Purchase Answer (5 Rinths)</button><br>';
                    } else {
                        maxActionsHtml += '<p style="font-size: 12px; color: #ccc;">The answer remains a secret behind this door..</p>';
                    }
                    
                    const penaltyText = chickenPenalty > 0 ? ' (Chicken Penalty: ' + chickenPenalty + ')' : '';
                    maxActionsHtml += '<button class="danger" onclick="abandonPuzzle(' + chickenPenalty + ', ' + maxReward + ')">Leaf Room' + penaltyText + '</button>';

                    questContent.innerHTML = '<div class="quest-header-flex">' +
                        '<span><strong>Question:</strong> ' + q + '</span>' +
                        (initialTimer > 0 ? '<span id="timer-display" style="color: #ffd700; font-weight: bold;"><img src="google_symb.png" style="width:16px; vertical-align:middle; margin-right:3px;" onerror="this.outerText=\'G\'"> <span id="time-val">' + timeLeft + '</span>s</span>' : '') +
                        '</div>' +
                        hintsHtml +
                        maxActionsHtml +
                        '<div id="feedback-msg" style="margin-top: 6px;"></div>';
                    return;
                }

                questContent.innerHTML = '<div class="quest-header-flex">' +
                    '<span><strong>Question:</strong> ' + q + '</span>' +
                    (initialTimer > 0 ? '<span id="timer-display" style="color: #ffd700; font-weight: bold;"><img src="google_symb.png" style="width:16px; vertical-align:middle; margin-right:3px;" onerror="this.outerText=\'G\'"> <span id="time-val">' + timeLeft + '</span>s</span>' : '') +
                    '</div>' +
                    '<div id="hint-container">' + hintsHtml + '</div>' +
                    '<input type="text" id="p-ans" placeholder="Your answer..." style="width: 85%; padding: 6px; margin-bottom: 6px; background: #333; border: 1px solid #555; color: #fff; border-radius: 4px;"><br>' +
                    '<button id="btn-ans">Reply</button>' +
                    '<button class="danger" onclick="abandonPuzzle(' + chickenPenalty + ', ' + maxReward + ')" style="margin-left: 5px;">Leave</button>' +
                    (chickenPenalty > 0 ? '<div style="text-align: right; margin-top: 6px; color: #ffd700; font-weight: bold; font-size: 12px;"><img src="Chicken_symb.png" style="width:16px; vertical-align:middle; margin-right:3px;" onerror="this.outerText=\'🐔\'">' + chickenPenalty + '</div>' : '') +
                    '<div id="feedback-msg" style="margin-top: 6px;"></div>';

                if (initialTimer > 0 && !activeTimerInterval && !isExpired) {
                    activeTimerInterval = setInterval(() => {
                        timeLeft--;
                        const timeValElem = document.getElementById('time-val');
                        if (timeValElem) timeValElem.textContent = timeLeft;

                        setTimerState(doorKey, { expired: timeLeft <= 0, timeLeft: timeLeft });

                        if (timeLeft <= 0) {
                            clearInterval(activeTimerInterval);
                            activeTimerInterval = null;
                            isExpired = true;
                            renderPuzzleScreen();
                        }
                    }, 1000);
                }

                document.getElementById('btn-ans').onclick = () => {
                    const ansInput = document.getElementById('p-ans');
                    const feedbackDiv = document.getElementById('feedback-msg');
                    const userAnswer = ansInput.value.trim();

                    if (userAnswer.length === 0) {
                        feedbackDiv.innerHTML = '<span style="color: #ff9800;">Vul ten minste 1 teken in!</span>';
                        return;
                    }

                    if(userAnswer.toLowerCase() === a.toLowerCase()) {
                        if (activeTimerInterval) { clearInterval(activeTimerInterval); activeTimerInterval = null; }
                        playerState.score += maxReward;
                        updateHeaderScore();

                        const alreadyVoted = hasVotedDoor(doorKey);

                        questContent.innerHTML = '<span style="color: #4cd137;">Correct! You have earned ' + maxReward + ' points. The door is open now.</span><br>' +
                            (!alreadyVoted ? '<p style="margin-top:10px; font-size:12px;">Rate this puzzle:</p>' +
                                '<div id="rating-buttons">' +
                                '<button style="background:transparent; border:none; cursor:pointer;" onclick="ratePuzzle(' + puzzle.id + ', 1, \'' + doorKey + '\')"><img src="like_green_symb.png" style="width:24px;" alt="Like" onerror="this.outerText=\'👍\'"></button>' +
                                '<button style="background:transparent; border:none; cursor:pointer;" onclick="ratePuzzle(' + puzzle.id + ', -1, \'' + doorKey + '\')"><img src="disLike_red_symb.png" style="width:24px;" alt="Dislike" onerror="this.outerText=\'👎\'"></button>' +
                                '</div>' : '<p style="margin-top:10px; font-size:11px; color: #4cd137;">✔ You have already rated this puzzle.</p>');
                        wrongAttemptsTracker[doorKey] = 0;
                        callback(true);
                    } else {
                        wrongAttemptsTracker[doorKey]++;
                        let currentWrong = wrongAttemptsTracker[doorKey];
                        const wrongPenalty = parseInt(puzzle.wrong_penalty) || 10;
                        
                        playerState.score -= wrongPenalty;
                        updateHeaderScore();

                        let feedbackMsg = '<span style="color: #ff6b6b;">Wrong answer! (-' + wrongPenalty + ' pts, Errors: ' + currentWrong + '/3)</span>';
                        if (currentWrong === 1 && puzzle.hint_1) {
                            feedbackMsg += '<br><span style="color: #3498db;">💡 Hint 1 has been released!</span>';
                        } else if (currentWrong === 2 && puzzle.hint_2) {
                            feedbackMsg += '<br><span style="color: #3498db;">💡 Hint 2 has been released!</span>';
                        }

                        feedbackDiv.innerHTML = feedbackMsg;
                        ansInput.value = '';

                        if (currentWrong >= 3) {
                            if (activeTimerInterval) { clearInterval(activeTimerInterval); activeTimerInterval = null; }
                            renderPuzzleScreen();
                        } else {
                            let updatedHintsHtml = '';
                            if (currentWrong >= 1 && puzzle.hint_1 && puzzle.hint_1.trim() !== "") {
                                updatedHintsHtml += '<p style="font-size: 11px; color: #3498db; margin: 4px 0;"><strong>Hint 1:</strong> ' + puzzle.hint_1 + ' (' + (puzzle.hint_1_option || '') + ')</p>';
                            }
                            if (currentWrong >= 2 && puzzle.hint_2 && puzzle.hint_2.trim() !== "") {
                                updatedHintsHtml += '<p style="font-size: 11px; color: #3498db; margin: 4px 0;"><strong>Hint 2:</strong> ' + puzzle.hint_2 + ' (' + (puzzle.hint_2_option || '') + ')</p>';
                            }
                            const hintContainer = document.getElementById('hint-container');
                            if(hintContainer) hintContainer.innerHTML = updatedHintsHtml;
                        }

                        callback(false);
                    }
                };
            }

            renderPuzzleScreen();
        }

        function updateHeaderScore() {
            const headerSpan = document.getElementById('game-header-title');
            if(headerSpan) {
                const parts = headerSpan.textContent.split('|');
                const roomPart = parts[0] ? parts[0].trim() : 'Speelveld';
                headerSpan.innerHTML = roomPart + ' | Score: <strong style="color: #4cd137;">' + playerState.score + '</strong>';
            }
        }

        async function ratePuzzle(puzzleId, vote, doorKey) {
            try {
                const { data: current } = await dbClient.from('puzzle_labyrinth').select('likes').eq('id', puzzleId).single();
                if (current) {
                    const newLikes = (current.likes || 0) + vote;
                    await dbClient.from('puzzle_labyrinth').update({ likes: newLikes }).eq('id', puzzleId);
                    
                    markDoorVoted(doorKey);

                    const ratingDiv = document.getElementById('rating-buttons');
                    if (ratingDiv) {
                        ratingDiv.innerHTML = '<span style="color: #4cd137; font-size: 12px;">Thank you for your review!</span>';
                    }
                }
            } catch (err) {
                console.error("Valuation error:", err);
            }
        }

        function revealDoorAnswer(correctAnswer, doorKey, maxReward) {
            if (activeTimerInterval) { clearInterval(activeTimerInterval); activeTimerInterval = null; }
            const questContent = document.getElementById('quest-content');
            questContent.innerHTML = '<span style="color: #ffd700;">The correct answer is: <strong>' + correctAnswer + '</strong>. The door is now open!</span>';
            
            wrongAttemptsTracker[doorKey] = 0;
            
            const parts = doorKey.split('_');
            const posX = parseInt(parts[0]);
            const posY = parseInt(parts[1]);
            const wallSide = parts[2];

            setLocalDoorStatus(posX, posY, wallSide);

            const doorElement = document.querySelector('[data-doorkey="' + doorKey + '"]');
            if (doorElement) {
                doorElement.src = 'DoorWay.png';
            }
        }

        function buyDoorAnswer(correctAnswer, doorKey, cost, maxReward) {
            if (playerState.rinths < cost) {
                alert("You don't have enough Rinths to buy this answer.!");
                return;
            }
            playerState.rinths -= cost;
            updatePlayerUI();
            revealDoorAnswer(correctAnswer, doorKey, maxReward);
        }

        function abandonPuzzle(penalty = 0, maxReward = 30) {
            if (activeTimerInterval) { clearInterval(activeTimerInterval); activeTimerInterval = null; }
            playerState.score -= penalty;
            updateHeaderScore();

            const questContent = document.getElementById('quest-content');
            const penMsg = penalty > 0 ? ' (Chicken Penalty: -' + penalty + ' punten)' : '';
            questContent.innerHTML = '<span style="color: #ff6b6b;">You have left the puzzle.' + penMsg + '. Click on another door to continue.</span>';
            document.querySelectorAll('.door-asset').forEach(d => d.classList.remove('selected'));
            selectedDoorKey = null;
        }

        // --- Initialisatie & Broodkruimels bijladen ---
        async function initGame() {
            renderBreadcrumbs();
            const targetRoomId = localStorage.getItem('target_room');
            
            if (targetRoomId) {
                localStorage.removeItem('target_room');
                try {
                    const { data, error } = await dbClient
                        .from('puzzle_labyrinth')
                        .select('pos_x, pos_y')
                        .eq('room_id', parseInt(targetRoomId, 10))
                        .limit(1);

                    if (!error && data && data.length > 0) {
                        const targetX = data[0].pos_x;
                        const targetY = data[0].pos_y;
                        loadRoomByCoords(targetX, targetY, 'south');
                        return;
                    }
                } catch (err) {
                    console.error("Error retrieving target room:", err);
                }
            }

            loadRoomByCoords(0, 0, 'south');
        }

        initGame();
    </script>
</body>
</html>
